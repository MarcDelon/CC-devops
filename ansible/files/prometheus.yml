global:
  scrape_interval: 15s

scrape_configs:
  # Prometheus se surveille lui-meme
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Metriques de la VM (CPU, RAM, disque, reseau)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Metriques de chaque conteneur Docker (CPU, RAM, reseau)
  - job_name: conteneurs
    static_configs:
      - targets: ["cadvisor:8080"]

  # L'application : blackbox-exporter appelle le site comme un visiteur
  # (en ligne ? code HTTP ? temps de reponse ?)
  - job_name: site
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://host.docker.internal:5111"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: application-5111
      - target_label: __address__
        replacement: blackbox:9115
