# Deploye par Ansible dans /opt/devops (VM Vagrant)
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"     # interface web
      - "50000:50000"   # agents
    environment:
      JAVA_OPTS: "-Xmx512m"
    volumes:
      - jenkins_home:/var/jenkins_home
    mem_limit: 900m

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/k8s:/etc/prometheus/k8s:ro     # jeton + certificat pour l'API Kubernetes
      - prometheus_data:/prometheus
    networks:
      - default
      - minikube          # pour joindre l'API Kubernetes de Minikube (192.168.49.2)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 300m

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m

  # Teste le site de l'exterieur : repond-il ? code HTTP ? temps de reponse ?
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"   # = la VM, ou le site ecoute sur 5111
    mem_limit: 64m

  # Mesure le CPU, la RAM et le reseau de chaque conteneur Docker
  cadvisor:
    # >= v0.54 : compatible avec le stockage "containerd snapshotter" de Docker 29
    image: ghcr.io/google/cadvisor:v0.61.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --disable_metrics=disk,diskIO,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    mem_limit: 200m

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    mem_limit: 256m

volumes:
  jenkins_home:
  prometheus_data:
  grafana_data:

networks:
  default:
  minikube:
    external: true        # reseau cree par "minikube start"
