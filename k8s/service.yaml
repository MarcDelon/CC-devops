# Service Kubernetes : point d'entree unique qui repartit le trafic entre les pods.
# NodePort 30080 : l'application est joignable sur l'IP du noeud Minikube, port 30080.
apiVersion: v1
kind: Service
metadata:
  name: cc-devops-app
  labels:
    app: cc-devops-app
spec:
  type: NodePort
  selector:
    app: cc-devops-app
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080
